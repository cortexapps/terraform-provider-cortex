# Terraform Provider testing workflow.
name: Tests

# Runs on every pull request and on pushes to main.
on:
  pull_request:
  push:
    branches:
      - "main"
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "TODO.md"

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.10.*"
          terraform_wrapper: false
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.10.*"
          terraform_wrapper: false
      - run: go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  # Run unit tests
  test:
    name: Unit Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      # resource.UnitTest cases run the Terraform CLI.
      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "1.10.*"
          terraform_wrapper: false
      - run: go mod download
      - name: Unit tests
        run: go test -v -cover ./...

  # Run acceptance tests against the real Cortex API. With CORTEX_API_URL unset,
  # the provider defaults to production (https://api.getcortexapp.com), so these
  # create and destroy real resources in the tenant that CORTEX_API_TOKEN owns.
  # That secret is not exposed to workflows triggered from forked PRs, and the
  # tests use shared, static resource tags against the one tenant — so this job
  # only runs on pushes to main and same-repo PRs, and is serialized repo-wide
  # via the concurrency group below. Fork PRs are verified after merge to main.
  # Dependabot runs get only Dependabot secrets, not Actions secrets, so the
  # token is empty there. Skip those runs too; main verifies them after merge.
  # This applies to any event Dependabot triggers, including push.
  acceptance-test:
    name: Terraform Provider Acceptance Tests
    needs: [build, test]
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cortex-acceptance-tenant
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.10.*"
          terraform_wrapper: false
      - run: go mod download
      - name: Acceptance tests
        env:
          TF_ACC: "1"
          CORTEX_API_TOKEN: ${{ secrets.CORTEX_API_TOKEN }}
        run: go test -v -cover ./...
