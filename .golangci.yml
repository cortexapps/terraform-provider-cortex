# Visit https://golangci-lint.run/ for usage documentation
# and information on other useful linters
version: "2"
run:
  concurrency: 4
  allow-parallel-runners: true
  timeout: 4m
linters:
  default: none
  enable:
    - copyloopvar
    - durationcheck
    - errcheck
    - godot
    - govet
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - predeclared
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    govet:
      # v2 adds these analyzers to the govet defaults. v1 did not run them.
      disable:
        - inline
        - hostport
        - waitgroup
    staticcheck:
      # v2 merged gosimple and stylecheck into staticcheck. Keep the v1 set
      # (SA and S checks): stylecheck and quickfix were not enabled before.
      checks:
        - all
        - -ST*
        - -QF*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    # v1 also excluded vendor and testdata. ./... never loads those
    # directories, so they need no entry here.
    paths:
      - (^|/)third_party($|/)
      - (^|/)builtin($|/)
      - (^|/)examples($|/)
      - (^|/)Godeps($|/)
issues:
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - (^|/)third_party($|/)
      - (^|/)builtin($|/)
      - (^|/)examples($|/)
      - (^|/)Godeps($|/)
