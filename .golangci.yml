# Visit https://golangci-lint.run/ for usage documentation
# and information on other useful linters
version: "2"
run:
  concurrency: 4
  allow-parallel-runners: true
  timeout: 4m
linters:
  default: none
  enable:
    - copyloopvar
    - durationcheck
    - errcheck
    - godot
    - govet
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - predeclared
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    staticcheck:
      # v2 merged gosimple and stylecheck into staticcheck. Keep the v1 set
      # (SA and S checks): stylecheck and quickfix were not enabled before.
      checks:
        - all
        - -ST*
        - -QF*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
